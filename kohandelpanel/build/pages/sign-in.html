    <main class="mt-0 transition-all duration-200 ease-in-out">
      <section>
        <div class="relative flex items-center min-h-screen p-0 overflow-hidden bg-center bg-cover">
          <div class="container z-1">
            <div class="flex flex-wrap -mx-3">
              <div class="flex flex-col w-full max-w-full px-3 mx-auto lg:mx-0 shrink-0 md:flex-0 md:w-7/12 lg:w-5/12 xl:w-4/12">
                <div class="relative flex flex-col min-w-0 break-words bg-transparent border-0 shadow-none lg:py4 dark:bg-gray-950 rounded-2xl bg-clip-border">
                  <div class="p-6 pb-0 mb-0">
                    <h4 class="font-bold">ورود به حساب</h4>
                    <p class="mb-0">ایمیل و رمز عبور خود را وارد کنید</p>
                  </div>
                  <div class="flex-auto p-6">
                    <form role="form">
                      <div class="mb-4">
                        <input type="email" placeholder="ایمیل" class="text-end focus:shadow-primary-outline dark:bg-gray-950 dark:placeholder:text-white/80 dark:text-white/80 text-sm leading-5.6 ease block w-full appearance-none rounded-lg border border-solid border-gray-300 bg-white p-3 font-normal text-gray-700 outline-none transition-all placeholder:text-gray-500 focus:border-fuchsia-300" />
                      </div>
                      <div class="mb-4">
                        <input type="password" placeholder="رمز عبور" class="text-end focus:shadow-primary-outline dark:bg-gray-950 dark:placeholder:text-white/80 dark:text-white/80 text-sm leading-5.6 ease block w-full appearance-none rounded-lg border border-solid border-gray-300 bg-white p-3 font-normal text-gray-700 outline-none transition-all placeholder:text-gray-500 focus:border-fuchsia-300" />
                      </div>
                      <div class="flex items-center pr-12 mb-0.5 text-right min-h-6">
                        <input id="rememberMe" class="mt-0.5 rounded-10 duration-250 ease-in-out after:rounded-circle after:shadow-2xl checked:after:translate-x-5.3 h-5 relative float-right -mr-12 w-10 cursor-pointer border border-solid border-gray-200 bg-zinc-700/10" type="checkbox" />
                        <label class="mr-2 font-normal cursor-pointer select-none text-sm text-slate-700" for="rememberMe">مرا به خاطر بسپار</label>
                      </div>
                      <div class="text-center">
                        <button type="button" class="inline-block w-full px-16 py-3.5 mt-6 mb-0 font-bold text-white bg-blue-500 rounded-lg shadow-md cursor-pointer hover:-translate-y-px hover:shadow-xs text-sm tracking-tight-rem">ورود</button>
                      </div>
                    </form>
                  </div>
                  <div class="border-black/12.5 rounded-b-2xl border-t-0 p-6 text-center pt-0 px-1 sm:px-6">
                    <p class="mx-auto mb-6 leading-normal text-sm">حساب کاربری ندارید؟ <a href="../pages/sign-up.html" class="font-semibold text-transparent bg-clip-text bg-gradient-to-tl from-blue-500 to-violet-500">ثبت‌نام کنید</a></p>
                  </div>
                </div>
              </div>
              <div class="absolute top-0 left-0 flex-col justify-center hidden w-6/12 h-full max-w-full px-3 pl-0 my-auto text-center flex-0 lg:flex">
                <div class="relative flex flex-col justify-center h-full bg-cover px-24 m-4 overflow-hidden bg-[url('https://raw.githubusercontent.com/creativetimofficial/public-assets/master/argon-dashboard-pro/assets/img/signin-ill.jpg')] rounded-xl ">
                  <span class="absolute top-0 right-0 w-full h-full bg-center bg-cover bg-gradient-to-tl from-blue-500 to-violet-500 opacity-60"></span>
                  <h4 class="z-20 mt-12 font-bold text-white">"توجه ارز جدید است"</h4>
                  <p class="z-20 text-white">هر چقدر نوشتار ساده‌تر باشد، تلاش نویسنده بیشتر بوده است.</p>
                </div>

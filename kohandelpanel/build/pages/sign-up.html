<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" sizes="76x76" href="../assets/img/apple-icon.png" />
    <link rel="icon" type="image/png" href="../assets/img/favicon.png" />
    <title>داشبورد اَرگون</title>
    <!-- فونت‌ها و آیکون‌ها -->
    <link href="https://fonts.googleapis.com/css?family=Vazirmatn:300,400,600,700" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
    <!-- استایل‌ها -->
    <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
    <link href="../assets/css/nucleo-svg.css" rel="stylesheet" />
    <link href="../assets/css/argon-dashboard-tailwind.css?v=1.0.1" rel="stylesheet" />
    <style>
      body {
        font-family: 'Vazirmatn', sans-serif;
      }
    </style>
  </head>
  <body class="m-0 font-sans antialiased font-normal bg-white text-right text-base leading-default text-slate-500">
    <!-- نوار بالا -->
    <nav class="absolute top-0 z-30 flex flex-wrap items-center justify-between w-full px-4 py-2 mt-6 mb-4 shadow-none lg:flex-nowrap lg:justify-start">
      <div class="container flex items-center justify-between py-0 flex-wrap-inherit">
        <a class="py-1.75 mr-4 font-bold text-white text-sm whitespace-nowrap lg:mr-0" href="index.html">داشبورد</a>
        <button navbar-trigger class="px-3 py-1 mr-2 leading-none transition-all ease-in-out bg-transparent border border-transparent rounded-lg shadow-none cursor-pointer text-lg lg:hidden" type="button" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
          <span class="inline-block mt-2 align-middle w-6 h-6">
            <span bar1 class="w-5.5 rounded-xs duration-350 block h-px bg-white mb-1"></span>
            <span bar2 class="w-5.5 rounded-xs duration-350 block h-px bg-white mb-1"></span>
            <span bar3 class="w-5.5 rounded-xs duration-350 block h-px bg-white"></span>
          </span>
        </button>
        <div navbar-menu class="items-center flex-grow transition-all ease duration-350 lg-max:bg-white lg-max:max-h-0 lg-max:overflow-hidden basis-full rounded-2xl lg:flex lg:basis-auto">
          <ul class="flex flex-col pr-0 mx-auto mb-0 list-none lg-max:py-2 lg:flex-row xl:ml-auto">
            <li>
              <a class="flex items-center px-4 py-2 ml-2 font-normal text-white transition-all duration-250 text-sm lg:px-2 hover:text-white/75" href="index.html">
                <i class="ml-1 fa fa-chart-pie opacity-60"></i> داشبورد
              </a>
            </li>
            <!-- <li>
              <a class="block px-4 py-2 ml-2 font-normal text-white transition-all duration-250 text-sm lg:px-2 hover:text-white/75" href="">
                <i class="ml-1 fa fa-user opacity-60"></i> پروفایل
              </a>
            </li> -->
            <li>
              <a class="block px-4 py-2 ml-2 font-normal text-white transition-all duration-250 text-sm lg:px-2 hover:text-white/75" href="../pages/sign-up.html">
                <i class="ml-1 fas fa-user-circle opacity-60"></i> ثبت نام
              </a>
            </li>
            <li>
              <a class="block px-4 py-2 ml-2 font-normal text-white transition-all duration-250 text-sm lg:px-2 hover:text-white/75" href="../pages/sign-in.html">
                <i class="ml-1 fas fa-key opacity-60"></i> ورود
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="mt-0 transition-all duration-200 ease-in-out">
      <section class="min-h-screen">
        <div class="bg-top relative flex items-start pt-12 pb-56 m-4 overflow-hidden bg-cover min-h-50-screen rounded-xl bg-[url('https://raw.githubusercontent.com/creativetimofficial/public-assets/master/argon-dashboard-pro/assets/img/signup-cover.jpg')]">
          <span class="absolute top-0 right-0 w-full h-full bg-center bg-cover bg-gradient-to-tl from-zinc-800 to-zinc-700 opacity-60"></span>
          <div class="container z-10">
            <div class="flex flex-wrap justify-center -mx-3">
              <div class="w-full max-w-full px-3 mx-auto mt-0 text-center lg:w-5/12">
                <h1 class="mt-12 mb-2 text-white">خوش آمدید</h1>
              </div>
            </div>
          </div>
        </div>
        <div class="container">
          <div class="flex flex-wrap -mx-3 -mt-48 md:-mt-56 lg:-mt-48">
            <div class="w-full max-w-full px-3 mx-auto mt-0 md:w-7/12 lg:w-5/12 xl:w-4/12">
              <div class="relative z-0 flex flex-col min-w-0 break-words bg-white border-0 shadow-xl rounded-2xl">
                <div class="p-6 mb-0 text-center bg-white border-b-0 rounded-t-2xl">
                  <h5>ثبت‌نام با ایمیل</h5>
                </div>
                <div class="flex-auto p-6">
                  <form>
                    <div class="mb-4">
                      <input type="text" class="text-right placeholder:text-gray-500 text-sm block w-full rounded-lg border border-gray-300 py-2 px-3 text-gray-700 focus:border-blue-500 focus:outline-none" placeholder="نام کامل" />
                    </div>
                    <div class="mb-4">
                      <input type="email" class="text-right placeholder:text-gray-500 text-sm block w-full rounded-lg border border-gray-300 py-2 px-3 text-gray-700 focus:border-blue-500 focus:outline-none" placeholder="ایمیل" />
                    </div>
                    <div class="mb-4">
                      <input type="password" class="text-right placeholder:text-gray-500 text-sm block w-full rounded-lg border border-gray-300 py-2 px-3 text-gray-700 focus:border-blue-500 focus:outline-none" placeholder="رمز عبور" />
                    </div>
                    <div class="min-h-6 pr-7 mb-0.5">
                      <input type="checkbox" checked class="float-right ml-2 w-5 h-5 rounded border border-slate-200" />
                      <label class="text-sm text-slate-700">با <a href="#" class="font-bold">قوانین و مقررات</a> موافقم</label>
                    </div>
                    <div class="text-center">
                      <button type="submit" class="w-full px-5 py-2.5 mt-6 font-bold text-white bg-gradient-to-tl from-zinc-800 to-zinc-700 rounded-lg text-sm">ثبت‌نام</button>
                    </div>
                    <p class="mt-4 mb-0 text-sm">حساب کاربری دارید؟ <a href="../pages/sign-in.html" class="font-bold">ورود</a></p>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="py-12">
      <div class="container">
        <div class="text-center">
          <a href="#" class="mx-2 text-slate-400">شرکت</a>
          <a href="#" class="mx-2 text-slate-400">درباره ما</a>
          <a href="#" class="mx-2 text-slate-400">تیم</a>
          <a href="#" class="mx-2 text-slate-400">محصولات</a>
          <a href="#" class="mx-2 text-slate-400">وبلاگ</a>
          <a href="#" class="mx-2 text-slate-400">قیمت‌گذاری</a>
        </div>
      </div>
    </footer>

    <script src="../assets/js/plugins/perfect-scrollbar.min.js" async></script>
    <script src="../assets/js/argon-dashboard-tailwind.js?v=1.0.1" async></script>
  </body>
</html>
